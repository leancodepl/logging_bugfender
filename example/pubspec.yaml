name: logging_bugfender_example
description: An example app showing how to integrate Bugfender with the logging package.
publish_to: none

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  logging: ^1.0.2
  logging_bugfender:
    path: ../

dev_dependencies:
  leancode_lint: '>=2.1.0 <2.2.0'

flutter:
  uses-material-design: true
